<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e0f7f4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f0fff0;stop-opacity:1" />
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.1"/>
    </filter>
  </defs>

  <circle cx="100" cy="100" r="90" fill="url(#bgGradient)" stroke="#d1e8e4" stroke-width="2" />

  <circle cx="100" cy="100" r="82" fill="none" stroke="#b2dcd4" stroke-width="1.5" stroke-dasharray="2,4" opacity="0.6"/>

  <text x="100" y="130" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="95" fill="#1a535c" text-anchor="middle" filter="url(#softShadow)">A</text>

  <rect x="50" y="145" width="100" height="8" rx="4" fill="#ff8b94" filter="url(#softShadow)" />
</svg>
